<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neonova - AI Innovation Studio</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap');
    
    body {
      font-family: 'Poppins', sans-serif;
    }
    
    .gradient-bg {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    }
    
    .gradient-card {
      background: linear-gradient(145deg, #f0f2ff 0%, #e0e7ff 100%);
    }
    
    .animate-float {
      animation: float 6s ease-in-out infinite;
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
    }
    
    .scroll-reveal {
      opacity: 0;
      transform: translateY(50px);
      transition: all 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    
    .scroll-reveal.revealed {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body class="bg-gradient-to-br from-purple-50 via-pink-50 to-orange-50 overflow-x-hidden">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    const Navbar = () => {
      const [isScrolled, setIsScrolled] = useState(false);
      const [isOpen, setIsOpen] = useState(false);

      useEffect(() => {
        const handleScroll = () => {
          setIsScrolled(window.scrollY > 50);
        };
        window.addEventListener('scroll', handleScroll);
        return () => window.removeEventListener('scroll', handleScroll);
      }, []);

      return (
        <nav className={`fixed top-0 left-0 right-0 z-50 transition-all duration-300 ${
          isScrolled ? 'bg-white/95 backdrop-blur-md shadow-lg' : 'bg-white/80 backdrop-blur-md'
        }`}>
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="flex justify-between items-center py-4">
              <div className="flex items-center space-x-2">
                <div className="w-10 h-10 bg-gradient-to-r from-purple-500 to-pink-500 rounded-2xl flex items-center justify-center">
                  <i className="fas fa-rocket text-white text-xl"></i>
                </div>
                <span className="text-2xl font-bold bg-gradient-to-r from-purple-600 to-pink-600 bg-clip-text text-transparent">
                  Neonova
                </span>
              </div>
              
              <div className="hidden md:flex items-center space-x-8">
                <a href="#home" className="text-gray-700 hover:text-purple-600 font-medium transition-colors">Home</a>
                <a href="#features" className="text-gray-700 hover:text-purple-600 font-medium transition-colors">Features</a>
                <a href="#about" className="text-gray-700 hover:text-purple-600 font-medium transition-colors">About</a>
                <a href="#contact" className="text-gray-700 hover:text-purple-600 font-medium transition-colors">Contact</a>
              </div>

              <div className="flex items-center space-x-4">
                <button className="hidden md:block px-6 py-2 bg-gradient-to-r from-purple-500 to-pink-500 text-white font-semibold rounded-full hover:shadow-lg hover:scale-105 transition-all duration-300">
                  Get Started
                </button>
                <button 
                  className="md:hidden p-2 rounded-lg hover:bg-gray-100"
                  onClick={() => setIsOpen(!isOpen)}
                >
                  <i className={`fas ${isOpen ? 'fa-times' : 'fa-bars'} text-xl text-purple-600`}></i>
                </button>
              </div>
            </div>
          </div>

          {/* Mobile Menu */}
          {isOpen && (
            <div className="md:hidden bg-white/95 backdrop-blur-md border-t border-gray-100 px-4 py-6 space-y-4">
              <a href="#home" className="block py-2 text-gray-700 font-medium hover:text-purple-600">Home</a>
              <a href="#features" className="block py-2 text-gray-700 font-medium hover:text-purple-600">Features</a>
              <a href="#about" className="block py-2 text-gray-700 font-medium hover:text-purple-600">About</a>
              <a href="#contact" className="block py-2 text-gray-700 font-medium hover:text-purple-600">Contact</a>
              <button className="w-full px-6 py-3 bg-gradient-to-r from-purple-500 to-pink-500 text-white font-semibold rounded-full hover:shadow-lg transition-all">
                Get Started
              </button>
            </div>
          )}
        </nav>
      );
    };

    const Hero = () => {
      const heroRef = useRef(null);

      return (
        <section id="home" className="min-h-screen flex items-center justify-center pt-20 px-4 relative overflow-hidden">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center relative z-10">
            <div className="scroll-reveal" ref={heroRef}>
              <div className="inline-flex items-center px-6 py-3 bg-gradient-to-r from-purple-100 to-pink-100 rounded-full mb-8">
                <i className="fas fa-sparkles text-purple-500 mr-2"></i>
                <span className="text-sm font-semibold text-purple-700">🚀 New Launch - AI Studio</span>
              </div>
              <h1 className="text-5xl md:text-7xl lg:text-8xl font-bold bg-gradient-to-r from-purple-600 via-pink-600 to-orange-500 bg-clip-text text-transparent mb-6 leading-tight">
                AI Innovation
                <span className="block text-4xl md:text-6xl lg:text-7xl">Studio</span>
              </h1>
              <p className="text-xl md:text-2xl text-gray-600 mb-12 max-w-3xl mx-auto leading-relaxed">
                Transform your ideas into intelligent solutions with our cutting-edge AI platform. 
                Build, deploy, and scale with confidence.
              </p>
              <div className="flex flex-col sm:flex-row gap-4 justify-center items-center">
                <button className="px-10 py-5 bg-gradient-to-r from-purple-500 to-pink-500 text-white font-bold text-lg rounded-3xl hover:shadow-2xl hover:scale-105 transition-all duration-300 w-full sm:w-auto">
                  Start Building Now
                </button>
                <button className="px-10 py-5 border-2 border-purple-200 bg-white text-purple-700 font-bold text-lg rounded-3xl hover:shadow-lg hover:scale-105 transition-all duration-300 w-full sm:w-auto">
                  Watch Demo <i className="fas fa-play ml-2"></i>
                </button>
              </div>
            </div>
          </div>

          {/* Floating Elements */}
          <div className="absolute top-20 left-10 w-20 h-20 bg-gradient-to-r from-blue-400 to-purple-500 rounded-3xl animate-float opacity-30"></div>
          <div className="absolute top-40 right-20 w-16 h-16 bg-gradient-to-r from-pink-400 to-orange-500 rounded-2xl animate-float opacity-30 animation-delay-1000"></div>
          <div className="absolute bottom-20 left-20 w-24 h-24 bg-gradient-to-r from-green-400 to-blue-500 rounded-3xl animate-float opacity-30 animation-delay-2000"></div>
        </section>
      );
    };

    const Features = () => {
      const featuresRef = useRef(null);
      const features = [
        {
          icon: 'fa-brain',
          title: 'AI Intelligence',
          description: 'Advanced neural networks and machine learning models for intelligent automation.',
          color: 'from-purple-500 to-pink-500'
        },
        {
          icon: 'fa-bolt',
          title: 'Lightning Fast',
          description: 'Deploy models in seconds with our optimized inference engine.',
          color: 'from-green-500 to-blue-500'
        },
        {
          icon: 'fa-shield-alt',
          title: 'Enterprise Secure',
          description: 'Military-grade security and compliance for your mission-critical applications.',
          color: 'from-orange-500 to-red-500'
        },
        {
          icon: 'fa-infinity',
          title: 'Unlimited Scale',
          description: 'Scale from prototype to production with zero infrastructure management.',
          color: 'from-indigo-500 to-purple-500'
        }
      ];

      return (
        <section id="features" className="py-32 px-4 relative">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="text-center mb-24 scroll-reveal">
              <h2 className="text-5xl md:text-6xl font-bold bg-gradient-to-r from-gray-800 to-gray-600 bg-clip-text text-transparent mb-6">
                Everything You Need
              </h2>
              <p className="text-xl text-gray-600 max-w-2xl mx-auto">
                Powerful features designed for developers, teams, and enterprises.
              </p>
            </div>

            <div className="grid md:grid-cols-2 lg:grid-cols-4 gap-8">
              {features.map((feature, index) => (
                <div 
                  key={index} 
                  className="group scroll-reveal gradient-card p-8 rounded-3xl hover:shadow-2xl hover:-translate-y-4 transition-all duration-500 border border-white/50"
                >
                  <div className={`w-16 h-16 bg-gradient-to-r ${feature.color} rounded-2xl flex items-center justify-center mb-6 group-hover:scale-110 transition-transform duration-300`}>
                    <i className={`fas ${feature.icon} text-2xl text-white`}></i>
                  </div>
                  <h3 className="text-2xl font-bold text-gray-800 mb-4">{feature.title}</h3>
                  <p className="text-gray-600 leading-relaxed">{feature.description}</p>
                </div>
              ))}
            </div>
          </div>
        </section>
      );
    };

    const About = () => {
      return (
        <section id="about" className="py-32 px-4 bg-gradient-to-b from-purple-50 to-pink-50">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="grid lg:grid-cols-2 gap-16 items-center">
              <div className="scroll-reveal order-2 lg:order-1">
                <h2 className="text-5xl md:text-6xl font-bold bg-gradient-to-r from-purple-600 to-pink-600 bg-clip-text text-transparent mb-8">
                  Built for the Future
                </h2>
                <p className="text-xl text-gray-600 mb-8 leading-relaxed">
                  We're redefining AI development with a platform that's intuitive, powerful, and fun. 
                  Join thousands of developers building the next generation of intelligent applications.
                </p>
                <div className="grid md:grid-cols-2 gap-6 mb-12">
                  <div className="flex items-center space-x-4 p-4 bg-white rounded-2xl shadow-lg">
                    <div className="w-12 h-12 bg-gradient-to-r from-green-500 to-blue-500 rounded-xl flex items-center justify-center">
                      <i className="fas fa-users text-white text-xl"></i>
                    </div>
                    <div>
                      <div className="font-bold text-2xl text-gray-800">50K+</div>
                      <div className="text-gray-600">Happy Users</div>
                    </div>
                  </div>
                  <div className="flex items-center space-x-4 p-4 bg-white rounded-2xl shadow-lg">
                    <div className="w-12 h-12 bg-gradient-to-r from-purple-500 to-pink-500 rounded-xl flex items-center justify-center">
                      <i className="fas fa-code text-white text-xl"></i>
                    </div>
                    <div>
                      <div className="font-bold text-2xl text-gray-800">1M+</div>
                      <div className="text-gray-600">Deployments</div>
                    </div>
                  </div>
                </div>
                <button className="px-10 py-4 bg-gradient-to-r from-purple-500 to-pink-500 text-white font-bold text-lg rounded-3xl hover:shadow-2xl hover:scale-105 transition-all duration-300">
                  Learn Our Story
                </button>
              </div>
              
              <div className="scroll-reveal order-1 lg:order-2">
                <div className="relative">
                  <div className="w-full h-96 bg-gradient-to-br from-purple-400 via-pink-400 to-orange-400 rounded-3xl shadow-2xl animate-float"></div>
                  <div className="absolute inset-8 bg-white rounded-2xl shadow-xl flex items-center justify-center">
                    <div className="text-center">
                      <i className="fas fa-rocket text-6xl text-purple-500 mb-6"></i>
                      <div className="text-3xl font-bold text-gray-800 mb-2">Launch Ready</div>
                      <div className="text-gray-600">In Minutes</div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>
      );
    };

    const CTA = () => {
      return (
        <section id="contact" className="py-32 px-4 relative overflow-hidden">
          <div className="absolute inset-0 bg-gradient-to-r from-purple-500/10 to-pink-500/10"></div>
          <div className="relative max-w-4xl mx-auto px-4 sm:px-6 lg:px-8 text-center scroll-reveal">
            <div className="bg-white/80 backdrop-blur-xl rounded-3xl p-12 shadow-2xl border border-white/50">
              <i className="fas fa-magic text-7xl bg-gradient-to-r from-purple-500 to-pink-500 text-transparent bg-clip-text mb-8"></i>
              <h2 className="text-4xl md:text-5xl font-bold bg-gradient-to-r from-gray-800 to-gray-600 bg-clip-text text-transparent mb-6">
                Ready to Build Something Amazing?
              </h2>
              <p className="text-xl text-gray-600 mb-12 max-w-2xl mx-auto">
                Join the future of AI development. Start your free trial today and experience the magic.
              </p>
              <div className="flex flex-col sm:flex-row gap-4 justify-center items-center">
                <button className="px-12 py-6 bg-gradient-to-r from-purple-500 to-pink-500 text-white font-bold text-xl rounded-3xl hover:shadow-2xl hover:scale-105 transition-all duration-300 w-full sm:w-auto">
                  Start Free Trial
                </button>
                <button className="px-12 py-6 border-4 border-purple-200 bg-transparent text-purple-700 font-bold text-xl rounded-3xl hover:shadow-xl hover:scale-105 transition-all duration-300 w-full sm:w-auto">
                  Book Demo
                </button>
              </div>
            </div>
          </div>
        </section>
      );
    };

    const Footer = () => {
      return (
        <footer className="bg-gradient-to-r from-purple-800 to-pink-800 text-white py-12 px-4">
          <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div className="grid md:grid-cols-4 gap-8 text-center md:text-left">
              <div>
                <div className="flex items-center justify-center md:justify-start space-x-3 mb-6">
                  <div className="w-12 h-12 bg-white rounded-2xl flex items-center justify-center">
                    <i className="fas fa-rocket text-purple-500 text-2xl"></i>
                  </div>
                  <span className="text-2xl font-bold">Neonova</span>
                </div>
                <p className="text-purple-200">Building the future of AI, one innovation at a time.</p>
              </div>
              <div>
                <h4 className="font-bold mb-4">Product</h4>
                <ul className="space-y-2 text-purple-200">
                  <li><a href="#" className="hover:text-white transition-colors">Features</a></li>
                  <li><a href="#" className="hover:text-white transition-colors">Pricing</a></li>
                  <li><a href="#" className="hover:text-white transition-colors">Docs</a></li>
                </ul>
              </div>
              <div>
                <h4 className="font-bold mb-4">Company</h4>
                <ul className="space-y-2 text-purple-200">
                  <li><a href="#" className="hover:text-white transition-colors">About</a></li>
                  <li><a href="#" className="hover:text-white transition-colors">Careers</a></li>
                  <li><a href="#" className="hover:text-white transition-colors">Blog</a></li>
                </ul>
              </div>
              <div>
                <h4 className="font-bold mb-4">Connect</h4>
                <div className="flex justify-center md:justify-start space-x-4">
                  <a href="#" className="w-10 h-10 bg-white/20 rounded-xl flex items-center justify-center hover:bg-white/40 transition-all">
                    <i className="fab fa-twitter text-white"></i>
                  </a>
                  <a href="#" className="w-10 h-10 bg-white/20 rounded-xl flex items-center justify-center hover:bg-white/40 transition-all">
                    <i className="fab fa-linkedin text-white"></i>
                  </a>
                  <a href="#" className="w-10 h-10 bg-white/20 rounded-xl flex items-center justify-center hover:bg-white/40 transition-all">
                    <i className="fab fa-discord text-white"></i>
                  </a>
                </div>
              </div>
            </div>
            <div className="border-t border-purple-700/50 mt-12 pt-8 text-center text-purple-200">
              <p>&copy; 2024 Neonova. All rights reserved. Made with ❤️ for innovators.</p>
            </div>
          </div>
        </footer>
      );
    };

    const App = () => {
      const [revealedElements, setRevealedElements] = useState({});

      const handleScroll = useCallback(() => {
        const elements = document.querySelectorAll('.scroll-reveal');
        elements.forEach((element) => {
          const elementTop = element.getBoundingClientRect().top;
          const elementVisible = 150;
          if (elementTop < window.innerHeight - elementVisible) {
            const elementId = element.getAttribute('data-id') || element.textContent.slice(0, 10);
            setRevealedElements(prev => ({ ...prev, [elementId]: true }));
          }
        });
      }, []);

      useEffect(() => {
        window.addEventListener('scroll', handleScroll);
        handleScroll();
        return () => window.removeEventListener('scroll', handleScroll);
      }, [handleScroll]);

      return (
        <div className="App">
          <Navbar />
          <Hero />
          <Features />
          <About />
          <CTA />
          <Footer />
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
